<div class="dashboard-container">
  <div class="greeting">
    <h2>Hallo Markus, du hast {{ openInvoices }} offene Rechnungen zur Freigabe.</h2>
  </div>

  <div class="filter-section">
    <button mat-button [class.active]="activeFilter === 'all'" (click)="setFilter('all')">Alle</button>
    <button mat-button [class.active]="activeFilter === 'overdue'" (click)="setFilter('overdue')">
      Überfällig ({{ overdueCount }})
    </button>
    <button mat-button [class.active]="activeFilter === 'draft'" (click)="setFilter('draft')">Entwürfe</button>
    <button mat-button [class.active]="activeFilter === 'completed'" (click)="setFilter('completed')">Abgeschlossen</button>
  </div>

  <table mat-table [dataSource]="invoices" class="invoice-table">
    <!-- Status Column -->
    <ng-container matColumnDef="status">
      <th mat-header-cell *matHeaderCellDef>STATUS</th>
      <td mat-cell *matCellDef="let invoice">
        <div class="status-cell" [ngClass]="invoice.statusClass">
          <mat-icon>{{ invoice.statusIcon }}</mat-icon>
          <span class="status-text">{{ invoice.statusText }}</span>
          <span class="status-detail" *ngIf="invoice.statusDetail">{{ invoice.statusDetail }}</span>
        </div>
      </td>
    </ng-container>

    <!-- Lieferant Column -->
    <ng-container matColumnDef="supplier">
      <th mat-header-cell *matHeaderCellDef>LIEFERANT</th>
      <td mat-cell *matCellDef="let invoice">
        <div class="supplier-cell">
          <div class="supplier-name">{{ invoice.supplierName }}</div>
          <div class="invoice-number">R-Nr: {{ invoice.invoiceNumber }}</div>
        </div>
      </td>
    </ng-container>

    <!-- Betrag Column -->
    <ng-container matColumnDef="amount">
      <th mat-header-cell *matHeaderCellDef>BETRAG</th>
      <td mat-cell *matCellDef="let invoice">{{ invoice.amount }}</td>
    </ng-container>

    <!-- Fälligkeit Column -->
    <ng-container matColumnDef="dueDate">
      <th mat-header-cell *matHeaderCellDef>FÄLLIGKEIT</th>
      <td mat-cell *matCellDef="let invoice">{{ invoice.dueDate }}</td>
    </ng-container>

    <!-- Aktion Column -->
    <ng-container matColumnDef="action">
      <th mat-header-cell *matHeaderCellDef>AKTION</th>
      <td mat-cell *matCellDef="let invoice">
        <button mat-raised-button color="primary" (click)="handleAction(invoice)">
          {{ invoice.actionText }}
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;" [class.overdue-row]="row.isOverdue"></tr>
  </table>
</div>
