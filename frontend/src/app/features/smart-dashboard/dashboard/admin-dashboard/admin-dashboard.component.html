<!-- Admin Dashboard: Konfiguration & Status -->
<div class="admin-dashboard">
  <!-- System Status -->
  <div class="status-section">
    <h1>SYSTEM STATUS</h1>
    <div class="status-indicators">
      <div class="status-item" [ngStyle]="{ color: getStatusColor() }">
        <mat-icon [ngStyle]="{ color: getStatusColor() }">{{ getStatusIcon() }}</mat-icon>
        <span>{{ getStatusText() }}</span>
      </div>
      <div class="status-divider">|</div>
      <div class="status-item auto-quota">
        <mat-icon>smart_toy</mat-icon>
        <span>{{ getAutoApprovalText() }}</span>
      </div>
    </div>
  </div>

  <!-- Stammdaten Verwaltung -->
  <div class="masterdata-section">
    <h2>STAMMDATEN VERWALTUNG</h2>

    <div class="masterdata-grid">
      <mat-card *ngFor="let section of masterDataSections"
                class="masterdata-card"
                (click)="onNavigateToSection(section)">
        <div class="card-icon">
          <mat-icon [matBadge]="section.count"
                    [matBadgeHidden]="!section.count"
                    matBadgeColor="primary"
                    aria-hidden="false">
            {{ section.icon }}
          </mat-icon>
        </div>
        <div class="card-content">
          <h3>{{ section.title }}</h3>
          <p>{{ section.description }}</p>
        </div>
        <div class="card-action">
          <mat-icon>chevron_right</mat-icon>
        </div>
      </mat-card>
    </div>
  </div>
