<div class="notifications-container">
  <div class="header">
    <h2>Benachrichtigungen</h2>
    <div class="actions">
      <button mat-button (click)="toggleUnreadOnly()">
        <mat-icon>{{ showUnreadOnly ? 'visibility_off' : 'visibility' }}</mat-icon>
        {{ showUnreadOnly ? 'Alle anzeigen' : 'Nur ungelesene' }}
      </button>
      <button mat-stroked-button color="primary" (click)="markAllAsRead()">
        <mat-icon>done_all</mat-icon>
        Alle als gelesen markieren
      </button>
    </div>
  </div>

  <div class="notifications-list">
    <ng-container *ngIf="notifications.length > 0; else empty">
      <div class="notification-card" *ngFor="let n of notifications; let last = last" [class.unread]="!n.isRead">
        <div class="notification-content" (click)="navigateTo(n)">
          <div class="text-content">
            <div class="title">
              {{ n.title }}
              <span class="priority" [ngClass]="n.priority.toLowerCase()">{{ n.priority }}</span>
            </div>
            <div class="message">{{ n.message }}</div>
            <div class="meta">
              <span class="timestamp">{{ n.createdAt | date: 'dd.MM.yyyy HH:mm' }}</span>
            </div>
          </div>
        </div>
        <div class="notification-actions">
          <button mat-icon-button (click)="markAsRead(n); $event.stopPropagation()" [disabled]="n.isRead" matTooltip="Als gelesen markieren" class="mark-read-btn">
            <mat-icon>done</mat-icon>
          </button>
        </div>
      </div>
    </ng-container>
  </div>

  <ng-template #empty>
    <div class="empty">
      <mat-icon>notifications_off</mat-icon>
      <p>Keine Benachrichtigungen vorhanden.</p>
    </div>
  </ng-template>
</div>
