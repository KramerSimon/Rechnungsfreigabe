<div class="roles-tab-container">
  <div class="header">
    <button mat-raised-button color="primary" (click)="createRole()">
      <mat-icon>add</mat-icon>
      Rolle hinzufügen
    </button>
  </div>

  <div class="table-container" *ngIf="!isLoading && roles.length > 0">
    <table mat-table [dataSource]="roles" class="roles-table">
      <!-- Color Column -->
      <ng-container matColumnDef="color">
        <th mat-header-cell *matHeaderCellDef>Farbe</th>
        <td mat-cell *matCellDef="let role">
          <span class="role-color-dot" [style.background-color]="role.color"></span>
        </td>
      </ng-container>

      <!-- Name Column -->
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>Name</th>
        <td mat-cell *matCellDef="let role">{{ role.name }}</td>
      </ng-container>

      <!-- Description Column -->
      <ng-container matColumnDef="description">
        <th mat-header-cell *matHeaderCellDef>Beschreibung</th>
        <td mat-cell *matCellDef="let role">{{ role.description || '-' }}</td>
      </ng-container>

      <!-- Permissions Column -->
      <ng-container matColumnDef="permissions">
        <th mat-header-cell *matHeaderCellDef>Berechtigungen</th>
        <td mat-cell *matCellDef="let role">
          <div class="role-badges-container">
            <div class="permission-chip" *ngFor="let permission of role.permissions">
              {{ permission }}
            </div>
          </div>
        </td>
      </ng-container>

      <!-- Is System Role Column -->
      <ng-container matColumnDef="isSystemRole">
        <th mat-header-cell *matHeaderCellDef>Systemrolle</th>
        <td mat-cell *matCellDef="let role">
          <mat-icon *ngIf="role.isSystemRole" color="primary" matTooltip="System Role">lock</mat-icon>
          <span *ngIf="!role.isSystemRole">-</span>
        </td>
      </ng-container>

      <!-- Actions Column -->
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Aktionen</th>
        <td mat-cell *matCellDef="let role">
          <button mat-icon-button (click)="editRole(role)" matTooltip="Edit">
            <mat-icon>edit</mat-icon>
          </button>
          <button
            mat-icon-button
            (click)="deleteRole(role)"
            [disabled]="role.isSystemRole"
            [matTooltip]="role.isSystemRole ? 'System roles cannot be deleted' : 'Delete'">
            <mat-icon [color]="role.isSystemRole ? '' : 'warn'">delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
  </div>

  <div class="loading-container" *ngIf="isLoading">
    <mat-spinner></mat-spinner>
  </div>

  <div class="empty-state" *ngIf="!isLoading && roles.length === 0">
    <mat-icon>group</mat-icon>
    <p>No roles found</p>
    <button mat-raised-button color="primary" (click)="createRole()">
      <mat-icon>add</mat-icon>
      Add First Role
    </button>
  </div>
</div>
