<div class="approval-rules-tab-container">
  <div class="header">
    <h2>Approval Rules Management</h2>
    <button mat-raised-button color="primary" (click)="createApprovalRule()">
      <mat-icon>add</mat-icon>
      Add Approval Rule
    </button>
  </div>

  <div class="table-container" *ngIf="!isLoading && approvalRules.length > 0">
    <table mat-table [dataSource]="approvalRules" class="approval-rules-table">
      <!-- ID Column -->
      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef>ID</th>
        <td mat-cell *matCellDef="let rule">{{ rule.id }}</td>
      </ng-container>

      <!-- Name Column -->
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>Name</th>
        <td mat-cell *matCellDef="let rule">{{ rule.name }}</td>
      </ng-container>

      <!-- Description Column -->
      <ng-container matColumnDef="description">
        <th mat-header-cell *matHeaderCellDef>Description</th>
        <td mat-cell *matCellDef="let rule">{{ rule.description || '-' }}</td>
      </ng-container>

      <!-- Rule Type Column -->
      <ng-container matColumnDef="ruleType">
        <th mat-header-cell *matHeaderCellDef>Type</th>
        <td mat-cell *matCellDef="let rule">
          <span class="rule-type-badge">{{ rule.ruleType }}</span>
        </td>
      </ng-container>

      <!-- Priority Column -->
      <ng-container matColumnDef="priority">
        <th mat-header-cell *matHeaderCellDef>Priority</th>
        <td mat-cell *matCellDef="let rule">{{ rule.priority }}</td>
      </ng-container>

      <!-- Is Active Column -->
      <ng-container matColumnDef="isActive">
        <th mat-header-cell *matHeaderCellDef>Active</th>
        <td mat-cell *matCellDef="let rule">
          <mat-icon [color]="rule.isActive ? 'primary' : ''" [matTooltip]="rule.isActive ? 'Active' : 'Inactive'">
            {{ rule.isActive ? 'check_circle' : 'cancel' }}
          </mat-icon>
        </td>
      </ng-container>

      <!-- Actions Column -->
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Actions</th>
        <td mat-cell *matCellDef="let rule">
          <button mat-icon-button (click)="editApprovalRule(rule)" matTooltip="Edit">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button (click)="deleteApprovalRule(rule)" matTooltip="Delete">
            <mat-icon color="warn">delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
  </div>

  <div class="loading-container" *ngIf="isLoading">
    <mat-spinner></mat-spinner>
  </div>

  <div class="empty-state" *ngIf="!isLoading && approvalRules.length === 0">
    <mat-icon>rule</mat-icon>
    <p>No approval rules found</p>
    <button mat-raised-button color="primary" (click)="createApprovalRule()">
      <mat-icon>add</mat-icon>
      Add First Approval Rule
    </button>
  </div>
</div>
