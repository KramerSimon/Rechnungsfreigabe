<div *ngIf="authState$ | async as authState">
  <nav class="navbar" *ngIf="authState.isAuthenticated">
    <div class="logo-card" aria-label="Firmenlogo">
      <img src="/images.jpeg" alt="App Logo" class="app-logo">
    </div>

    <!-- Rollenbasierte Navigation -->
    <div class="nav-links" *ngIf="availableRoutes$ | async as routes">
      <button mat-button
              *ngFor="let route of routes"
              [routerLink]="route.path"
              routerLinkActive="active"
              class="nav-link">
        {{ route.title }}
      </button>
    </div>

    <!-- Notifications button (left of account) -->
    <button mat-icon-button
            routerLink="/notifications"
            class="notification-button"
            [matBadge]="(unreadCount$ | async) || 0"
            matBadgeColor="warn"
            matBadgeOverlap="false"
            [matTooltip]="t('toolbar.notifications')">
      <mat-icon>notifications</mat-icon>
    </button>

    <button mat-icon-button
            class="language-button"
            [matMenuTriggerFor]="languageMenu"
            [matTooltip]="t('toolbar.language')">
      <mat-icon>translate</mat-icon>
    </button>

        <button mat-icon-button
          class="theme-toggle-button"
          (click)="toggleDarkMode()"
          [matTooltip]="isDarkMode ? t('toolbar.theme.light') : t('toolbar.theme')">
          <mat-icon>{{ isDarkMode ? 'light_mode' : 'dark_mode' }}</mat-icon>
        </button>

    <!-- User Profile Dropdown -->
    <button mat-icon-button
            [matMenuTriggerFor]="accountMenu"
            class="account-button">
      <mat-icon>account_circle</mat-icon>
    </button>

    <mat-menu #accountMenu="matMenu" class="account-menu">
      <div class="user-profile-header" (click)="$event.stopPropagation()">
        <mat-icon class="user-avatar">account_circle</mat-icon>
        <div class="user-info">
          <div class="user-name">{{ authState.user?.fullName || authState.user?.username }}</div>
          <div class="user-email">{{ authState.user?.email }}</div>
          <div class="user-roles">
            <span *ngFor="let role of authState.user?.roles"
                  class="role-badge"
                  [style.backgroundColor]="role.color || '#ff9800'">
              {{ role.name }}
            </span>
            <span *ngIf="(authState.user?.roles?.length ?? 0) === 0"
                  class="role-badge empty">
              Keine Rolle
            </span>
          </div>
        </div>
      </div>

      <mat-divider></mat-divider>

      <button mat-menu-item (click)="editCurrentUser()">
        <mat-icon>edit</mat-icon>
        <span>{{ t('toolbar.editUser') }}</span>
      </button>

      <mat-divider></mat-divider>

      <button mat-menu-item (click)="logout()">
        <mat-icon>logout</mat-icon>
        <span>{{ t('toolbar.logout') }}</span>
      </button>
    </mat-menu>

    <mat-menu #languageMenu="matMenu" class="language-menu">
      <button mat-menu-item
              *ngFor="let option of languageOptions"
              (click)="setLanguage(option.code)">
        <mat-icon>{{ currentLanguage === option.code ? 'check' : 'language' }}</mat-icon>
        <span>{{ option.label }}</span>
      </button>
    </mat-menu>
  </nav>
</div>

<router-outlet></router-outlet>
