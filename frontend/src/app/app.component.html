<div *ngIf="authState$ | async as authState">
  <nav class="navbar" *ngIf="authState.isAuthenticated">
    <img src="/images.jpeg" alt="App Logo" class="app-logo">

    <!-- Rollenbasierte Navigation -->
    <div class="nav-links" *ngIf="availableRoutes$ | async as routes">
      <button mat-button
              *ngFor="let route of routes"
              [routerLink]="route.path"
              routerLinkActive="active"
              class="nav-link">
        {{ route.title }}
      </button>
    </div>

    <!-- Legacy Admin Link (falls vorhanden) -->
    <button mat-button
            *ngIf="(currentRole$ | async) === 'admin'"
            routerLink="/admin/rules"
            class="nav-link">
      Regeln
    </button>

    <!-- Notifications button (left of account) -->
    <button mat-icon-button
            routerLink="/notifications"
            class="notification-button"
            [matBadge]="(unreadCount$ | async) || 0"
            matBadgeColor="warn"
            matBadgeOverlap="false"
            matTooltip="Benachrichtigungen">
      <mat-icon>notifications</mat-icon>
    </button>

    <!-- User Profile Dropdown -->
    <button mat-icon-button
            [matMenuTriggerFor]="accountMenu"
            class="account-button">
      <mat-icon>account_circle</mat-icon>
    </button>

    <mat-menu #accountMenu="matMenu" class="account-menu">
      <div class="user-profile-header" (click)="$event.stopPropagation()">
        <mat-icon class="user-avatar">account_circle</mat-icon>
        <div class="user-info">
          <div class="user-name">{{ authState.user?.fullName || authState.user?.username }}</div>
          <div class="user-email">{{ authState.user?.email }}</div>
          <div class="user-role" *ngIf="currentRoleTitle$ | async as roleTitle">
            Dashboard: <strong>{{ roleTitle }}</strong>
          </div>
        </div>
      </div>

      <mat-divider></mat-divider>

      <!-- Dashboard-Wechsel für Admins -->
      <div *ngIf="(currentRole$ | async) === 'admin'" class="dashboard-switcher">
        <div class="menu-section-title">Dashboard wechseln:</div>
        <button mat-menu-item routerLink="/dashboard/admin" routerLinkActive="active">
          <mat-icon>admin_panel_settings</mat-icon>
          <span>Konfiguration</span>
        </button>
        <button mat-menu-item routerLink="/dashboard/accounting" routerLinkActive="active">
          <mat-icon>account_balance</mat-icon>
          <span>Cockpit</span>
        </button>
        <button mat-menu-item routerLink="/dashboard/user" routerLinkActive="active">
          <mat-icon>task</mat-icon>
          <span>Meine Aufgaben</span>
        </button>
        <mat-divider></mat-divider>
      </div>

      <!-- Dashboard-Wechsel für Buchhaltung -->
      <div *ngIf="(currentRole$ | async) === 'accounting'" class="dashboard-switcher">
        <div class="menu-section-title">Dashboard wechseln:</div>
        <button mat-menu-item routerLink="/dashboard/accounting" routerLinkActive="active">
          <mat-icon>account_balance</mat-icon>
          <span>Cockpit</span>
        </button>
        <button mat-menu-item routerLink="/dashboard/user" routerLinkActive="active">
          <mat-icon>task</mat-icon>
          <span>Meine Aufgaben</span>
        </button>
        <mat-divider></mat-divider>
      </div>

      <button mat-menu-item routerLink="/account">
        <mat-icon>settings</mat-icon>
        <span>Einstellungen</span>
      </button>
      <button mat-menu-item routerLink="/notifications" [matBadge]="(unreadCount$ | async) || 0" matBadgeColor="warn" matBadgeOverlap="false">
        <mat-icon>notifications</mat-icon>
        <span>Benachrichtigungen</span>
      </button>
      <button mat-menu-item routerLink="/help">
        <mat-icon>help_outline</mat-icon>
        <span>Hilfe & Support</span>
      </button>

      <mat-divider></mat-divider>

      <button mat-menu-item (click)="logout()">
        <mat-icon>logout</mat-icon>
        <span>Abmelden</span>
      </button>
    </mat-menu>
  </nav>
</div>

<router-outlet></router-outlet>
