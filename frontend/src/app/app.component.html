<div *ngIf="authState$ | async as authState">
  <nav class="navbar" *ngIf="authState.isAuthenticated">
    <img src="/images.jpeg" alt="App Logo" class="app-logo">

    <!-- Rollenbasierte Navigation -->
    <div class="nav-links" *ngIf="availableRoutes$ | async as routes">
      <button mat-button
              *ngFor="let route of routes"
              [routerLink]="route.path"
              routerLinkActive="active"
              class="nav-link">
        {{ route.title }}
      </button>
    </div>

    <!-- Notifications button (left of account) -->
    <button mat-icon-button
            routerLink="/notifications"
            class="notification-button"
            [matBadge]="(unreadCount$ | async) || 0"
            matBadgeColor="warn"
            matBadgeOverlap="false"
            matTooltip="Benachrichtigungen">
      <mat-icon>notifications</mat-icon>
    </button>

    <!-- User Profile Dropdown -->
    <button mat-icon-button
            [matMenuTriggerFor]="accountMenu"
            class="account-button">
      <mat-icon>account_circle</mat-icon>
    </button>

    <mat-menu #accountMenu="matMenu" class="account-menu">
      <div class="user-profile-header" (click)="$event.stopPropagation()">
        <mat-icon class="user-avatar">account_circle</mat-icon>
        <div class="user-info">
          <div class="user-name">{{ authState.user?.fullName || authState.user?.username }}</div>
          <div class="user-email">{{ authState.user?.email }}</div>
          <div class="user-roles">
            <span *ngFor="let role of authState.user?.roles"
                  class="role-badge"
                  [style.backgroundColor]="role.color || '#ff9800'">
              {{ role.name }}
            </span>
            <span *ngIf="(authState.user?.roles?.length ?? 0) === 0"
                  class="role-badge empty">
              Keine Rolle
            </span>
          </div>
        </div>
      </div>

      <mat-divider></mat-divider>

      <button mat-menu-item (click)="editCurrentUser()">
        <mat-icon>edit</mat-icon>
        <span>Benutzer bearbeiten</span>
      </button>

      <mat-divider></mat-divider>

      <button mat-menu-item (click)="logout()">
        <mat-icon>logout</mat-icon>
        <span>Abmelden</span>
      </button>
    </mat-menu>
  </nav>
</div>

<router-outlet></router-outlet>
